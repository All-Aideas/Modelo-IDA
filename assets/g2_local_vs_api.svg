<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img"
    aria-label="El costo de API sube con el uso; el del servidor propio es fijo. Se cruzan recien a gran escala">
    <text x="70" y="18" font-size="13.5" font-weight="800" fill="#2e3a4d" font-family="Montserrat,Helvetica,Arial,sans-serif">La API sube con el uso; el servidor propio no baja nunca</text>
    <line x1="70" y1="328" x2="696" y2="328" stroke="#eef1f5"/>
    <text x="61" y="332" font-size="11" fill="#8a94a6" text-anchor="end" font-family="Montserrat,Helvetica,Arial,sans-serif">$0k</text><line x1="70" y1="274.5454545454545" x2="696" y2="274.5454545454545" stroke="#eef1f5"/>
    <text x="61" y="278.5454545454545" font-size="11" fill="#8a94a6" text-anchor="end" font-family="Montserrat,Helvetica,Arial,sans-serif">$2k</text><line x1="70" y1="221.0909090909091" x2="696" y2="221.0909090909091" stroke="#eef1f5"/>
    <text x="61" y="225.0909090909091" font-size="11" fill="#8a94a6" text-anchor="end" font-family="Montserrat,Helvetica,Arial,sans-serif">$4k</text><line x1="70" y1="167.63636363636365" x2="696" y2="167.63636363636365" stroke="#eef1f5"/>
    <text x="61" y="171.63636363636365" font-size="11" fill="#8a94a6" text-anchor="end" font-family="Montserrat,Helvetica,Arial,sans-serif">$6k</text><line x1="70" y1="114.18181818181817" x2="696" y2="114.18181818181817" stroke="#eef1f5"/>
    <text x="61" y="118.18181818181817" font-size="11" fill="#8a94a6" text-anchor="end" font-family="Montserrat,Helvetica,Arial,sans-serif">$8k</text><line x1="70" y1="60.727272727272734" x2="696" y2="60.727272727272734" stroke="#eef1f5"/>
    <text x="61" y="64.72727272727273" font-size="11" fill="#8a94a6" text-anchor="end" font-family="Montserrat,Helvetica,Arial,sans-serif">$10k</text><text x="70" y="348" font-size="11" fill="#8a94a6" text-anchor="middle" font-family="Montserrat,Helvetica,Arial,sans-serif">0k h</text><text x="278.66666666666663" y="348" font-size="11" fill="#8a94a6" text-anchor="middle" font-family="Montserrat,Helvetica,Arial,sans-serif">15k h</text><text x="487.3333333333333" y="348" font-size="11" fill="#8a94a6" text-anchor="middle" font-family="Montserrat,Helvetica,Arial,sans-serif">30k h</text><text x="696" y="348" font-size="11" fill="#8a94a6" text-anchor="middle" font-family="Montserrat,Helvetica,Arial,sans-serif">45k h</text>
    <line x1="70" y1="189.82000000000002" x2="696" y2="189.82000000000002" stroke="#8a94a6" stroke-width="2" stroke-dasharray="6 4"/>
    <line x1="70" y1="102.95636363636362" x2="696" y2="102.95636363636362" stroke="#B02A37" stroke-width="3"/>
    <line x1="70" y1="328" x2="696" y2="75.42727272727271" stroke="#D9480F" stroke-width="3"/>
    <circle cx="627.7693121693122" cy="102.95636363636362" r="4.5" fill="#B02A37"/>
    <text x="627.7693121693122" y="90.95636363636362" font-size="11.5" font-weight="700" fill="#B02A37" text-anchor="middle" font-family="Montserrat,Helvetica,Arial,sans-serif">empatan: 251 personas</text>
    <text x="78" y="93.95636363636362" font-size="11.5" font-weight="700" fill="#B02A37" font-family="Montserrat,Helvetica,Arial,sans-serif">Local completo $8.420/mes — fijo</text>
    <text x="78" y="180.82000000000002" font-size="11.5" fill="#8a94a6" font-family="Montserrat,Helvetica,Arial,sans-serif">Solo el fierro $5.170/mes</text>
    <text x="292.5777777777778" y="229.19636363636366" font-size="11.5" font-weight="700" fill="#D9480F" font-family="Montserrat,Helvetica,Arial,sans-serif">API: pagás por uso</text>
    <text x="78" y="290.5818181818182" font-size="11.5" font-weight="700" fill="#D9480F" font-family="Montserrat,Helvetica,Arial,sans-serif">Acá la API gana por lejos</text>
    <text x="78" y="309.2909090909091" font-size="11" fill="#8a94a6" font-family="Montserrat,Helvetica,Arial,sans-serif">60 h/mes de emails = $13 contra $8.420</text>
    <text x="383" y="370" font-size="11.5" fill="#8a94a6" text-anchor="middle" font-family="Montserrat,Helvetica,Arial,sans-serif">Horas automatizadas por mes</text>
    <text x="14" y="44" font-size="11.5" fill="#8a94a6" font-family="Montserrat,Helvetica,Arial,sans-serif">Costo/mes</text>
  </svg>
